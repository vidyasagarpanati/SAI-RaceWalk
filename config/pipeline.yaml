# Race walking biomechanics pipeline configuration.
# Every value here is part of the reproducibility hash. Change it and the affected steps re-run.

version: 1

paths:
  runs_dir: runs
  outputs_dir: outputs
  models_dir: models
  pose_model_file: pose_landmarker_full.task   # MediaPipe "full" == model_complexity 1

frames:
  analysis_fps: 60          # decode target. Uses min(native_fps, analysis_fps).
  jpeg_quality: 92
  max_frames: 20000         # hard stop so a long video cannot fill the disk

pose:
  num_poses: 1
  min_pose_detection_confidence: 0.5
  min_pose_tracking_confidence: 0.5
  min_pose_presence_confidence: 0.5
  delegate: CPU             # GPU reserved for Ollama

quality_gates:
  landmark_track_confidence: 0.5      # track only at or above this
  landmark_low_confidence_flag: 0.3   # below this -> DETECTED - LOW CONFIDENCE
  angle_min_confidence: 0.4           # every landmark of an angle must reach this
  min_visible_landmarks: 20           # of 33, else INSUFFICIENT_LANDMARKS

smoothing:
  enabled: true
  method: savgol            # savgol | none
  window: 9                 # frames, must be odd (angles and orientation measures)
  polyorder: 2
  foot_window: 5            # shorter window for foot position, so contact edges stay sharp

stats:
  min_strides_for_sd: 5     # below this, SD and drift are suppressed, not estimated
  min_strides_for_drift: 12 # early-versus-late comparison needs at least this many strides per leg

report:
  # A section the model cannot produce after all attempts is rendered as
  # "NOT AVAILABLE" with its reason, and the report is published marked PARTIAL.
  allow_partial: true
  model_image_max_width: 768    # key frames sent to the model are downscaled to this
  max_event_frames_per_type: 3  # annotated screenshots per flagged event type
  max_events_listed: 14         # rows in Section 1

llm:
  base_url: http://localhost:11434
  model: qwen3.6:35b        # same tag as the archery pipeline; run `ollama list` to confirm
  temperature: 0.0
  seed: 20260923
  top_p: 1.0
  num_ctx: 16384      # prompt + images + reply must fit; raise if replies are cut off
  num_predict: 4096   # hard cap on reply tokens per section
  request_timeout_s: 300
  max_retries_per_section: 3
  retry_backoff_base_s: 1.0   # exponential: 1s, 2s, 4s ...
  retry_backoff_max_s: 30.0
  max_evidence_lines: 70      # EVIDENCE entries per call
  max_prior_points: 4         # analysis points carried from each earlier section
  max_prior_chars: 200        # clip length for text carried from earlier sections
  max_prior_section_chars: 2200
  warn_prompt_tokens: 7000
  send_key_frames_to_model: true   # only if the model reports the vision capability
  think: false                     # disable reasoning tokens on thinking models (Qwen3)
  max_images_per_section: 2

render:
  embed_frames: true
  jpeg_quality_embed: 85
  max_embedded_frame_width: 1100
  key_frame_max_width: 1920      # frames are downscaled to this width before annotation (4K in, 1080p-class out)

video:
  render_full_annotated: true
  render_event_clips: true      # one short clip per flagged event
  event_clip_pad_s: 0.75
  output_crf: 20
  output_preset: medium
  output_max_width: 1920        # annotated video is downscaled to this width (4K in, 1080p-class out)
